<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Sarina's Dog</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600&family=VT323&display=swap">
<style>
/* Layout: one-screen console. HUD on top, 3D stage fills the middle, a sheet slides in under the stage, action dock at the bottom. */
:root{
  --ink:#1b1426; --panel:#2c2140; --panel-2:#3d2e57; --line:#0e0a16; --hi:#5a4680; --lo:#231a35;
  --paper:#f4e9cf; --paper-dim:#bcae93; --accent:#ff8a3d; --good:#8be04e; --warn:#ffd23f; --bad:#ff5a5f; --sky:#8fd0f0;
  --belly:#ff9b3d; --happy:#ff6fb1; --clean:#5ad1ff; --energy:#ffd23f;
  --hand:'Pixelify Sans','Courier New',monospace; --body:'VT323','Courier New',monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ink);color:var(--paper);font:21px/1.05 var(--body);overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--warn);outline-offset:2px}
#app{height:100%;display:flex;flex-direction:column;min-height:0}

/* HUD */
#hud{background:var(--panel);border-bottom:4px solid var(--line);flex:none}
.hud-in{display:grid;grid-template-columns:auto 1fr auto;gap:8px 14px;align-items:center;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.id{display:flex;gap:8px;align-items:center;min-width:0}
#portrait{width:48px;height:48px;image-rendering:pixelated;border:3px solid var(--line);box-shadow:0 0 0 2px var(--hi);background:#000;flex:none}
#dogName{width:12ch;background:transparent;border:0;border-bottom:2px dashed var(--hi);color:var(--paper);font:600 17px var(--hand);padding:0 0 1px;min-width:0}
.lvl{display:flex;gap:6px;align-items:center;font-size:19px;color:var(--paper-dim);margin-top:2px}
.xp{width:54px;height:8px;background:var(--line);border:1px solid var(--line)}
.xp i{display:block;height:100%;width:0;background:var(--good)}
.bars{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px 12px;min-width:0}
.bar{min-width:0}
.bar label{display:flex;justify-content:space-between;font-size:18px;color:var(--paper-dim);letter-spacing:.06em}
.bar label b{color:var(--paper);font-weight:400}
.track{height:12px;background:var(--line);border:2px solid var(--line);box-shadow:0 0 0 1px var(--hi);position:relative}
.track i{display:block;height:100%;width:50%;background:var(--c,var(--good));transition:width .25s steps(6)}
.bar.low .track i{animation:blink .6s steps(2) infinite}
@keyframes blink{50%{background:var(--bad)}}
.meta{display:flex;gap:8px;align-items:center;justify-content:flex-end}
.pill{display:flex;align-items:center;gap:6px;background:var(--line);border:2px solid var(--hi);padding:3px 8px;font-family:var(--hand);font-size:16px;white-space:nowrap}
.pill.money{color:var(--warn)}
.pill small{font:inherit;font-size:13px;color:var(--paper-dim)}
#sun{width:12px;height:12px;background:var(--warn);border-radius:50%;box-shadow:0 0 0 2px #7a5b00;flex:none}
#sun.night{background:#cfd8ff;box-shadow:inset -4px -2px 0 #4a5290}
.mini{background:var(--panel-2);border:2px solid var(--line);box-shadow:inset 2px 2px 0 var(--hi),inset -2px -2px 0 var(--lo);font:600 13px var(--hand);padding:5px 7px}
.mini[aria-pressed="true"]{color:var(--bad)}

/* Stage */
#stage{position:relative;flex:1;min-height:160px;background:#000;overflow:hidden;touch-action:none}
#c{position:absolute;inset:0;width:100%;height:100%;display:block;image-rendering:pixelated;image-rendering:crisp-edges;cursor:grab}
#c.petting{cursor:pointer}
#views{position:absolute;left:0;right:0;bottom:8px;display:flex;gap:6px;justify-content:center;flex-wrap:wrap;padding-inline:8px;pointer-events:none}
#views button{pointer-events:auto;background:rgba(27,20,38,.82);border:2px solid var(--line);box-shadow:inset 2px 2px 0 var(--hi);font:600 14px var(--hand);padding:4px 9px;letter-spacing:.04em}
#views button.on{background:var(--accent);color:var(--ink);box-shadow:inset 2px 2px 0 #ffd0a8}
#bubble{position:absolute;left:50%;top:20%;transform:translate(-50%,-100%);background:var(--paper);color:var(--ink);border:3px solid var(--line);padding:4px 10px;font-size:22px;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .2s;z-index:3;max-width:90%}
#bubble::after{content:"";position:absolute;left:50%;bottom:-11px;margin-left:-6px;border:6px solid transparent;border-top-color:var(--line);border-bottom:0}
#bubble.on{opacity:1}
#toasts{position:absolute;top:8px;left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:4px;pointer-events:none;z-index:4}
.toast{background:rgba(27,20,38,.92);border:2px solid var(--hi);padding:3px 10px;font-size:21px;animation:tin .25s steps(4),tout .4s steps(4) 3.2s forwards;max-width:92%;text-align:center}
.toast.good{border-color:var(--good)} .toast.bad{border-color:var(--bad)} .toast.gold{border-color:var(--warn);color:var(--warn)}
@keyframes tin{from{transform:translateY(-12px);opacity:0}}
@keyframes tout{to{opacity:0;transform:translateY(-8px)}}
#hint{position:absolute;left:10px;top:8px;font-size:18px;color:rgba(244,233,207,.65);pointer-events:none;text-shadow:2px 2px 0 #000}
#hint:empty{display:none}
#wm{position:absolute;right:max(10px,env(safe-area-inset-right,0px));top:8px;font:600 14px var(--hand);letter-spacing:.06em;color:rgba(244,233,207,.6);text-shadow:2px 2px 0 #000;pointer-events:none;z-index:2}
.pop{position:absolute;pointer-events:none;font:600 20px var(--hand);z-index:5;animation:floatup 1s steps(10) forwards;text-shadow:2px 2px 0 #000}
@keyframes floatup{to{transform:translateY(-60px);opacity:0}}
#fade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .22s steps(5);z-index:6}
#fade.on{opacity:1}
#bathbar{position:absolute;left:50%;top:10px;transform:translateX(-50%);width:min(70%,320px);display:none;z-index:4;text-align:center}
#bathbar.on{display:block}
#bathbar .track{height:16px}
#bathbar .track i{background:var(--clean)}
#bathbar div:first-child{font-family:var(--hand);font-size:15px;margin-bottom:3px;text-shadow:2px 2px 0 #000}

/* Sheet (under the stage so the dog stays visible) */
#sheet{flex:none;max-height:min(40%,340px);display:flex;flex-direction:column;background:var(--panel);border-top:4px solid var(--line);box-shadow:0 -3px 0 var(--hi);min-height:0}
#sheet[hidden]{display:none}
.sheet-head{display:flex;align-items:center;gap:10px;padding-block:6px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:2px solid var(--line);flex:none}
.sheet-head h2{margin:0;font:600 17px var(--hand);color:var(--warn);letter-spacing:.06em;flex:none}
#tabs{display:flex;gap:4px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:none}
#tabs button{flex:none;background:var(--ink);border:2px solid var(--line);font:600 13px var(--hand);padding:4px 8px;color:var(--paper-dim)}
#tabs button.on{background:var(--accent);color:var(--ink)}
#sheetBody{overflow-y:auto;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-height:0;flex:1;-webkit-overflow-scrolling:touch}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:8px}
.card{display:flex;gap:8px;background:var(--panel-2);border:3px solid var(--line);box-shadow:inset 2px 2px 0 var(--hi);padding:6px;min-width:0}
.card .sw{width:34px;height:34px;flex:none;border:2px solid var(--line);align-self:flex-start;image-rendering:pixelated}
.card .tx{min-width:0;flex:1;display:flex;flex-direction:column;gap:2px}
.card b{font:600 14px var(--hand);line-height:1.15;overflow-wrap:anywhere}
.card p{margin:0;font-size:18px;color:var(--paper-dim);line-height:1}
.card .row{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:2px}
.btn{background:var(--accent);color:var(--ink);border:2px solid var(--line);box-shadow:inset 2px 2px 0 #ffd0a8,inset -2px -2px 0 #b3531a;font:600 13px var(--hand);padding:4px 8px}
.btn:active{transform:translateY(1px)}
.btn.alt{background:var(--good);box-shadow:inset 2px 2px 0 #d3ffb0,inset -2px -2px 0 #4d8a1f}
.btn.dim{background:var(--hi);color:var(--paper);box-shadow:inset 2px 2px 0 #7a62a8,inset -2px -2px 0 var(--lo)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.tag{font:600 12px var(--hand);color:var(--warn)}
.tag.lock{color:var(--bad)}
.note{font-size:20px;color:var(--paper-dim);margin:0 0 6px}
.jobs{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px}
#work{display:flex;flex-direction:column;align-items:center;gap:6px}
#wc{width:min(100%,520px);aspect-ratio:8/5;background:#120d1c;border:3px solid var(--line);image-rendering:pixelated;touch-action:none;cursor:crosshair}
#wstat{display:flex;gap:14px;font:600 15px var(--hand)}

/* Dock */
#dock{flex:none;background:var(--panel);border-top:4px solid var(--line);padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.act{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;min-height:50px;background:var(--panel-2);border:3px solid var(--line);box-shadow:inset 3px 3px 0 var(--hi),inset -3px -3px 0 var(--lo),0 3px 0 var(--line);padding:4px 2px 3px;font-family:var(--hand);font-weight:600;font-size:15px;letter-spacing:.05em}
.act::before{content:"";position:absolute;left:4px;right:4px;top:4px;height:4px;background:var(--c)}
.act small{font-family:var(--body);font-weight:400;font-size:17px;color:var(--paper-dim);letter-spacing:0;margin-top:3px}
.act:active{transform:translateY(2px);box-shadow:inset 3px 3px 0 var(--lo),inset -3px -3px 0 var(--hi),0 1px 0 var(--line)}
.act[disabled]{opacity:.4;cursor:not-allowed}
.act.on{background:var(--c);color:var(--ink)} .act.on small{color:var(--ink)}
.act.need{animation:need .8s steps(2) infinite}
@keyframes need{50%{border-color:var(--warn)}}
@media (min-width:860px){
  #dock{grid-template-columns:repeat(8,minmax(0,1fr))}
  .hud-in{gap:8px 24px}
}
@media (max-width:640px){
  .hud-in{grid-template-columns:1fr auto}
  .bars{grid-column:1/-1;grid-template-columns:repeat(2,minmax(0,1fr))}
  #dogName{width:8ch}
}
@media (max-height:620px){ #sheet{max-height:44%} .act{min-height:42px} }

/* Intro */
#intro{position:absolute;inset:0;z-index:20;background:rgba(14,10,22,.9);display:flex;align-items:center;justify-content:center;padding:16px}
#intro[hidden]{display:none}
.intro-card{width:min(420px,100%);background:var(--panel);border:4px solid var(--line);box-shadow:inset 3px 3px 0 var(--hi),0 6px 0 #000;padding:14px;display:flex;flex-direction:column;gap:8px;align-items:center;text-align:center}
.intro-card img{width:112px;height:112px;image-rendering:pixelated;border:3px solid var(--line);box-shadow:0 0 0 3px var(--accent)}
.intro-card h1{margin:0;font:600 24px var(--hand);color:var(--warn);text-wrap:balance}
.intro-card p{margin:0;font-size:22px;color:var(--paper)}
.intro-card .dim{color:var(--paper-dim)}
#fallback{position:absolute;inset:0;display:none;align-items:center;justify-content:center;text-align:center;padding:20px;z-index:10;font-size:24px}
</style>

    if (!ctx || (S && S.muted)) return;

    g.gain.setValueAtTime(vol || .06, t);

    if (!ctx || (S && S.muted)) return;

  }

    yip() { tone(700, .08, 'square', .05, 200); tone(900, .08, 'square', .05, 150, .09); },

const PF = { list: [], geo: null };
function pfEmit(x, y, z, vx, vy, vz, life, color, size) {
  if (!PF.geo) PF.geo = new THREE.IcosahedronGeometry(1, 0);
  let p = PF.list.find(q => q.life <= 0);
  if (!p) {
    if (PF.list.length > 120) return;
    const m = new THREE.Mesh(PF.geo, new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true }));
    scene.add(m); p = { m, vx: 0, vy: 0, vz: 0, life: 0, max: 1, grav: 0 }; PF.list.push(p);
  }
  p.m.position.set(x, y, z); p.m.material.color.setHex(color); p.m.material.opacity = 1;
  p.m.scale.setScalar(size || .08); p.m.visible = true;
  p.vx = vx; p.vy = vy; p.vz = vz; p.life = life; p.max = life; p.grav = 0; return p;
}
function pfUpdate(dt) {
  PF.list.forEach(p => {
    if (p.life <= 0) { p.m.visible = false; return; }
    p.life -= dt; p.vy += p.grav * dt;
    p.m.position.x += p.vx * dt; p.m.position.y += p.vy * dt; p.m.position.z += p.vz * dt;
    p.m.material.opacity = clamp(p.life / p.max * 1.5, 0, 1);
  });
}

function bandanaTex() {
  return canvasTex(32, 32, (g, w, h) => {
    g.fillStyle = '#1f9d63'; g.fillRect(0, 0, w, h);
    g.fillStyle = '#157a4b'; for (let i = 0; i < w; i += 8) for (let j = 0; j < h; j += 8) g.fillRect(i + 4, j + 4, 1, 1);
    const clover = (cx, cy) => {
      g.fillStyle = '#8de8a8';
      g.fillRect(cx - 2, cy - 2, 2, 2); g.fillRect(cx + 1, cy - 2, 2, 2); g.fillRect(cx - 2, cy + 1, 2, 2); g.fillRect(cx + 1, cy + 1, 2, 2);
      g.fillStyle = '#d6ffe0'; g.fillRect(cx, cy, 1, 1); g.fillStyle = '#157a4b'; g.fillRect(cx, cy + 3, 1, 2);
    };
    for (let j = 0; j < 4; j++) for (let i = 0; i < 4; i++) clover(4 + i * 8 + (j % 2 ? 4 : 0), 4 + j * 8);
  });
}

function buildRoom(group, half, height, floorTex, wallTex, ceilColor) {
  const floorMat = new THREE.MeshStandardMaterial({ map: T(floorTex, half, half), roughness: 1, flatShading: true });
  const wallMat = new THREE.MeshStandardMaterial({ map: T(wallTex, half, 2), roughness: 1, flatShading: true });
  const f = plane(half * 2, half * 2, floorMat); f.rotation.x = -Math.PI / 2; group.add(f);
  [[0, -half, 0], [0, half, Math.PI], [-half, 0, Math.PI / 2], [half, 0, -Math.PI / 2]].forEach(w => {
    const m = plane(half * 2, height, wallMat); m.position.set(w[0], height / 2, w[1]); m.rotation.y = w[2]; group.add(m);
    const bb = box(half * 2, .25, .12, 0x5a4636); bb.position.set(w[0] + Math.sin(w[2]) * .06, .12, w[1] + Math.cos(w[2]) * .06); bb.rotation.y = w[2]; group.add(bb);
  });
  const ceilMat = new THREE.MeshStandardMaterial({ color: ceilColor, roughness: 1, flatShading: true });
  const c = plane(half * 2, half * 2, ceilMat); c.rotation.x = Math.PI / 2; c.position.y = height; group.add(c);
  return { floorMat, wallMat, ceilMat };
}
function windowFrame(group, x, y, z, rotY, w, h) {
  const g = new THREE.Group(); g.position.set(x, y, z); g.rotation.y = rotY;
  const view = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ color: 0x8fd0f0 }));
  g.add(view);
  const fr = 0x5a4636;
  put(g, box(w + .2, .1, .1, fr), 0, h / 2, .03); put(g, box(w + .2, .1, .1, fr), 0, -h / 2, .03);
  put(g, box(.1, h, .1, fr), -w / 2, 0, .03); put(g, box(.1, h, .1, fr), w / 2, 0, .03);
  put(g, box(.06, h, .06, fr), 0, 0, .03); put(g, box(w, .06, .06, fr), 0, 0, .03);
  const stars = new THREE.Group(); [[-.5, .5], [.4, .2], [-.2, -.4], [.6, -.5], [0, .7]].forEach(p => put(stars, box(.06, .06, .02, 0xffffff, { emissive: 0xffffff }), p[0] * w / 2, p[1] * h / 2, .02));
  g.add(stars); group.add(g);
  return { viewMat: view.material, stars };
}

const nm = () => S.name || DEFAULT_NAME;

/* ---------- mood ---------- */

  if (S.energy < 22) G.mood = 'sleepy';
  else if (S.happy < 30 || S.belly < 20 || S.clean < 18) G.mood = 'sad';
  else if (isNight() && S.energy < 55) G.mood = 'sleepy';
  else if (S.happy > 68 && S.belly > 35 && S.clean > 35) G.mood = 'happy';

/* ---------- places ---------- */

  if (GM.busy) return;
  GM.busy = true; $('#fade').classList.add('on');
  setTimeout(() => {
    G.bathing = false; $('#bathbar').classList.remove('on'); G.eating = 0; G.carrying = false; G.moving = 0; G.zoomies = 0;

}

/* ---------- time + needs ---------- */

  if (G.sleeping) {
    S.energy += gm * .42 * bedMult(); S.belly -= gm * .02; S.happy += gm * .01;
  } else {
    S.belly -= gm * .07 * (hasUp('dispenser') ? .75 : 1) * (park ? 1.5 : 1);
    S.clean -= gm * .04 * (hasUp('washer') ? .7 : 1) * (park ? 1.8 : 1) * (G.loc === 'bath' ? 0 : 1);
    S.energy -= gm * (night ? .075 : .05) * (hasUp('heater') ? .8 : 1) * (park ? 1.5 : 1);
    let hd = .05;
    if (S.belly < 25) hd += .06; if (S.clean < 25) hd += .04; if (S.energy < 20) hd += .05;
    if (park) hd = -.22 * (hasUp('shoes') ? 1.5 : 1);
    S.happy -= gm * hd;
    if (park) giveXP(gm * .004);
  }
  S.belly = clamp(S.belly, 0, 100); S.clean = clamp(S.clean, 0, 100); S.energy = clamp(S.energy, 0, 100); S.happy = clamp(S.happy, 0, 100);

  if (G.eating > 0) {
    G.eating -= dt; GM.chew = (GM.chew || 0) - dt;
    if (GM.chew <= 0) { Snd.crunch(); GM.chew = .55; if (bowl && bowl.heap) bowl.heap.scale.multiplyScalar(.82); }

function updateMove(dt, t) {
  const r = D.root;
  let speed = 0;
  if (G.sleeping || G.bathing || G.eating > 0) {
    G.moving = lerp(G.moving, 0, Math.min(1, dt * 8));
    r.position.x *= .85; r.position.z *= .85;
    r.rotation.y += angDiff(r.rotation.y, 0) * Math.min(1, dt * 6);
    if (G.loc !== 'park') return;
  }
  if (G.loc === 'park' && !G.sleeping) {
    const zoom = G.zoomies > 0 ? 2 : 1;
    if (NAV.mode === 'pause') {
      NAV.wait -= dt; if (NAV.wait <= 0 && !(G.eating > 0)) {
        const a = rnd(0, TAU), d = rnd(2, 7); NAV.tx = Math.cos(a) * d; NAV.tz = Math.sin(a) * d; NAV.mode = 'wander';
      }
    }
    if (NAV.mode === 'wander' || NAV.mode === 'fetch' || NAV.mode === 'return') {
      const dx = NAV.tx - r.position.x, dz = NAV.tz - r.position.z, dist = Math.hypot(dx, dz);
      const want = Math.atan2(dx, dz);
      r.rotation.y += angDiff(r.rotation.y, want) * Math.min(1, dt * 7);
      const sp = (NAV.mode === 'wander' ? 1.7 : 4.6) * zoom;
      if (dist > .35) {
        if (Math.abs(angDiff(r.rotation.y, want)) < 1.2) { speed = sp; r.position.x += Math.sin(r.rotation.y) * sp * dt; r.position.z += Math.cos(r.rotation.y) * sp * dt; }
      } else if (NAV.mode === 'wander') { NAV.mode = 'pause'; NAV.wait = rnd(1.5, 4); }
      else if (NAV.mode === 'fetch') { W.ball.visible = false; G.carrying = true; NAV.mode = 'return'; NAV.tx = 0; NAV.tz = 0; Snd.pop(); }
      else if (NAV.mode === 'return') { fetchDone(); }
    }
    G.moving = lerp(G.moving, speed, Math.min(1, dt * 8));
    return;
  }
  /* indoors */
  if (G.zoomies > 0 && G.loc === 'home') {
    GM.za = (GM.za || 0) + dt * 3.4; const R = 1.7;
    r.position.x = Math.cos(GM.za) * R; r.position.z = Math.sin(GM.za) * R; r.rotation.y = -GM.za + Math.PI;
    G.moving = 5;
  } else if (!G.sleeping) {
    r.position.x += (0 - r.position.x) * Math.min(1, dt * 4); r.position.z += (0 - r.position.z) * Math.min(1, dt * 4);
    r.rotation.y += angDiff(r.rotation.y, 0) * Math.min(1, dt * 5);
    G.moving = lerp(G.moving, 0, Math.min(1, dt * 8));
  }
}

      const row = document.createElement('div'); row.className = 'row'; const bt = document.createElement('button'); bt.className = 'btn'; bt.textContent = 'START'; bt.addEventListener('click', () => { Snd.init(); startJob(j[0]); }); row.appendChild(bt); tx.appendChild(row); c.appendChild(tx); jobs.appendChild(c);

/* ---------- buying and using ---------- */
function buy(cat, id) {

  if (S.level < (it.lvl || 1)) return nope('Reach level ' + it.lvl + ' first.');
  if (S.money < it.price) return nope('Not enough money.');
  S.money -= it.price; Snd.buy();
  if (cat === 'food') { S.inv[id] = (S.inv[id] || 0) + 1; toast('Bought ' + it.name + '.', 'good'); }
  else { S.owned[cat].push(id); toast('Bought ' + it.name + '!', 'gold'); autoUse(cat, id); }
  touch(); renderSheet(); save();
}
function autoUse(cat, id) {
  if (cat === 'acc') equip(id);
  else if (cat === 'toys' || cat === 'decor') { placeToggle(cat, id); }
  else if (cat !== 'upgrades') useItem(cat, id);
}
function equip(id) {
  const it = find('acc', id); const on = S.eq[it.slot] === id;
  S.eq[it.slot] = on ? null : id; refreshAcc(); touch();
  const p = D.root.position; burst(p.x, p.y + 1.8, p.z + .3, 0xffd23f, 10, 2, -3); Snd.pop();
  if (!on) { setView({ hat: 'face', glasses: 'face', face: 'face', back: 'back', neck: 'full' }[it.slot]); toast(nm() + ' is wearing the ' + it.name.toLowerCase() + '.', 'good'); bubble(pick(['Looking good.', 'I feel fancy.', 'Take a photo.']), 2.4); }
  renderSheet();
}
function placeToggle(cat, id) {
  const arr = S.placed[cat], i = arr.indexOf(id); if (i >= 0) arr.splice(i, 1); else arr.push(id);

}
function useItem(cat, id) {
  const key = { beds: 'bed', walls: 'wall', floors: 'floor', designs: 'design', envs: 'env' }[cat]; S.sel[key] = id; Snd.pop();
  if (cat === 'beds') { refreshBed(); toast('New bed ready for bedtime.', 'good'); }
  else if (cat === 'envs') { buildEnv(id); if (G.loc === 'park') showLocation('park'); toast('Take a WALK to visit.', 'good'); }
  else { refreshHome(); if (G.loc !== 'home' && !G.sleeping) goLoc('home'); }
  touch(); renderSheet();
}

/* =========================================================
   WORK MINIGAMES
   ========================================================= */
const WORK = { active: null, raf: 0 };
function payMult() { return 1 + (hasUp('coffee') ? .2 : 0); }
function startJob(kind) {
  if (G.sleeping) return nope(nm() + ' is sleeping.');
  const body = $('#sheetBody'); $('#tabs').innerHTML = '';
  body.innerHTML = '<div id="work"><div id="wstat"><span id="wscore"></span><span id="wtime"></span></div><canvas id="wc" width="320" height="200"></canvas><p class="note" id="wmsg"></p></div>';
  const c = $('#wc'); WORK.active = kind; $('#sheetTitle').textContent = kind === 'bones' ? 'BONE CATCHER' : 'KIBBLE PACKER';
  if (kind === 'bones') bonesGame(c); else packerGame(c);
}
function stopWork() { if (WORK.raf) cancelAnimationFrame(WORK.raf); WORK.raf = 0; WORK.active = null; }
function finishJob(score, pay, msg) {
  stopWork();
  pay = Math.round(pay * payMult()); if (pay > 0) addMoney(pay);
  S.stats.work++; giveXP(8); touch(); save();
  const body = $('#sheetBody');
  body.innerHTML = '<div id="work"><p class="note" style="font-size:26px;color:var(--warn)"></p><p class="note"></p><div class="row" style="display:flex;gap:8px"></div></div>';
  body.querySelector('.note').textContent = pay > 0 ? 'Paid $' + pay + '!' : 'No pay this time.';
  body.querySelectorAll('.note')[1].textContent = msg;
  const row = body.querySelector('.row');
  const again = document.createElement('button'); again.className = 'btn'; again.textContent = 'AGAIN'; again.addEventListener('click', () => { Snd.click(); startJob(SHEET.lastJob); }); row.appendChild(again);
  const back = document.createElement('button'); back.className = 'btn dim'; back.textContent = 'JOBS'; back.addEventListener('click', () => { Snd.click(); renderSheet(); }); row.appendChild(back);
}
function ptrXY(e, c) { const r = c.getBoundingClientRect(); return { x: (e.clientX - r.left) / r.width * c.width, y: (e.clientY - r.top) / r.height * c.height }; }
function bonesGame(c) {
  SHEET.lastJob = 'bones';
  const g = c.getContext('2d'); g.imageSmoothingEnabled = false;
  let items = [], score = 0, left = 20, spawn = 0, last = performance.now(), flash = [];
  function drawBone(x, y, col) { g.fillStyle = col; g.fillRect(x - 9, y - 2, 18, 4); g.fillRect(x - 11, y - 5, 4, 4); g.fillRect(x - 11, y + 1, 4, 4); g.fillRect(x + 7, y - 5, 4, 4); g.fillRect(x + 7, y + 1, 4, 4); }
  function drawSock(x, y) { g.fillStyle = '#6f8fb3'; g.fillRect(x - 5, y - 9, 10, 12); g.fillRect(x - 5, y + 1, 14, 6); g.fillStyle = '#e8e8e8'; g.fillRect(x - 5, y - 9, 10, 3); }
  c.onpointerdown = e => {
    e.preventDefault(); Snd.init(); const p = ptrXY(e, c);
    for (let i = items.length - 1; i >= 0; i--) {
      const it = items[i]; if (Math.abs(it.x - p.x) < 20 && Math.abs(it.y - p.y) < 20) {
        items.splice(i, 1);
        if (it.k === 'bone') { score += 1; Snd.pop(); flash.push({ x: it.x, y: it.y, t: '+1', c: '#fff', l: .5 }); }
        else if (it.k === 'gold') { score += 4; Snd.coin(); flash.push({ x: it.x, y: it.y, t: '+4', c: '#ffd23f', l: .6 }); }
        else { score = Math.max(0, score - 3); Snd.nope(); flash.push({ x: it.x, y: it.y, t: '-3', c: '#ff5a5f', l: .6 }); }
        break;
      }
    }
  };
  function loop(now) {
    if (WORK.active !== 'bones') return;
    const dt = Math.min(.05, (now - last) / 1000); last = now; left -= dt; spawn -= dt;
    if (spawn <= 0) { spawn = rnd(.4, .65); const r = Math.random(); items.push({ x: rnd(18, 302), y: -12, vy: rnd(60, 100) * (1 + (20 - left) / 28), k: r < .64 ? 'bone' : r < .76 ? 'gold' : 'sock' }); }
    items.forEach(it => { it.y += it.vy * dt; }); items = items.filter(it => it.y < 215);
    flash.forEach(f => { f.l -= dt; f.y -= 30 * dt; }); flash = flash.filter(f => f.l > 0);
    g.fillStyle = '#120d1c'; g.fillRect(0, 0, 320, 200); g.fillStyle = '#2a6a2e'; g.fillRect(0, 188, 320, 12);
    items.forEach(it => { if (it.k === 'bone') drawBone(it.x, it.y, '#f4efe0'); else if (it.k === 'gold') drawBone(it.x, it.y, '#ffd23f'); else drawSock(it.x, it.y); });
    g.font = 'bold 14px monospace'; flash.forEach(f => { g.fillStyle = f.c; g.fillText(f.t, f.x - 8, f.y); });
    $('#wscore').textContent = 'SCORE ' + score; $('#wtime').textContent = 'TIME ' + Math.max(0, Math.ceil(left));

    WORK.raf = requestAnimationFrame(loop);
  }
  $('#wmsg').textContent = 'Tap the bones before they hit the ground.';
  WORK.raf = requestAnimationFrame(loop);
}
function packerGame(c) {
  SHEET.lastJob = 'packer';
  const g = c.getContext('2d'); g.imageSmoothingEnabled = false;
  let round = 0, cx = 0, dir = 1, zone = rnd(80, 240), zw = 64, pay = 0, combo = 0, perfects = 0, msg = '', msgT = 0, last = performance.now();
  const total = 8;
  c.onpointerdown = e => {
    e.preventDefault(); Snd.init();
    const d = Math.abs(cx - zone);
    if (d <= zw / 2) { combo++; perfects++; const gain = 5 + Math.min(combo - 1, 4); pay += gain; msg = 'PERFECT +$' + gain; Snd.coin(); }
    else if (d <= zw) { combo = 0; pay += 2; msg = 'GOOD +$2'; Snd.pop(); }
    else { combo = 0; msg = 'MISS'; Snd.nope(); }
    msgT = .8; round++; zw = Math.max(22, zw - 5); zone = rnd(50, 270);
    if (round >= total) { finishJob(perfects, pay, perfects + ' of ' + total + ' perfect.'); }
  };
  function loop(now) {
    if (WORK.active !== 'packer') return;
    const dt = Math.min(.05, (now - last) / 1000); last = now; msgT -= dt;
    cx += dir * (190 + round * 28) * dt; if (cx > 320) { cx = 320; dir = -1; } if (cx < 0) { cx = 0; dir = 1; }
    g.fillStyle = '#120d1c'; g.fillRect(0, 0, 320, 200);
    g.fillStyle = '#3d2e57'; g.fillRect(0, 110, 320, 40);
    g.fillStyle = '#8be04e'; g.fillRect(zone - zw / 2, 110, zw, 40); g.fillStyle = '#4d8a1f'; g.fillRect(zone - zw / 4, 110, zw / 2, 40);
    g.fillStyle = '#ffd23f'; g.fillRect(cx - 2, 100, 4, 60);
    g.fillStyle = '#8a5a3b'; for (let i = 0; i < 5; i++) g.fillRect(((i * 70 + now / 20) % 360) - 20, 60, 16, 16);
    g.font = 'bold 16px monospace'; g.fillStyle = '#f4e9cf'; if (msgT > 0) g.fillText(msg, 110, 190);
    $('#wscore').textContent = 'BAG ' + Math.min(round + 1, total) + '/' + total; $('#wtime').textContent = 'PAY $' + pay + (combo > 1 ? '  x' + combo : '');
    if (WORK.active === 'packer') WORK.raf = requestAnimationFrame(loop);
  }
  $('#wmsg').textContent = 'Tap when the needle is inside the green zone.';
  WORK.raf = requestAnimationFrame(loop);
}

/* =========================================================
   INPUT
   ========================================================= */
const ptr = { down: false, x: 0, y: 0, sx: 0, sy: 0, moved: 0, mode: null, t0: 0, hit: null, lx: 0, ly: 0 };
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
function isDog(o) { while (o) { if (o === D.root) return true; o = o.parent; } return false; }
function raycast(e) {
  const r = canvasEl.getBoundingClientRect();
  ndc.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  const list = [D.root];
  CLK.forEach(c => { if (c.loc === G.loc) list.push(c.obj); });
  if (G.loc === 'park' && W.ground) list.push(W.ground);
  const hits = ray.intersectObjects(list, true);
  for (let i = 0; i < hits.length; i++) {
    const h = hits[i]; if (!h.object.visible && !h.object.material.visible === false) continue;
    if (h.object === W.ground) return { type: 'ground', point: h.point };
    if (isDog(h.object)) return { type: 'dog', point: h.point };
    let o = h.object; while (o && !o.userData.onClick) o = o.parent;
    if (o) return { type: 'click', fn: o.userData.onClick, point: h.point };
  }
  return { type: 'none' };
}
function initInput() {
  const cv = canvasEl;
  cv.addEventListener('pointerdown', e => {
    Snd.init(); try { cv.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
    const r = stageEl.getBoundingClientRect();
    ptr.down = true; ptr.moved = 0; ptr.t0 = performance.now(); ptr.sx = ptr.lx = e.clientX; ptr.sy = ptr.ly = e.clientY;
    ptr.x = e.clientX - r.left; ptr.y = e.clientY - r.top;
    const h = raycast(e); ptr.hit = h;
    if (h.type === 'dog' && G.bathing) ptr.mode = 'scrub';
    else if (h.type === 'dog' && !G.sleeping && !G.bathing && G.loc !== 'bath') { ptr.mode = 'pet'; G.petting = true; GM.petAcc = .25; canvasEl.classList.add('petting'); }
    else if (h.type === 'dog' && G.sleeping) { ptr.mode = 'none'; bubble('Zzz...', 1.2); }
    else ptr.mode = 'orbit';
  });
  cv.addEventListener('pointermove', e => {
    if (!ptr.down) return;
    const r = stageEl.getBoundingClientRect(); ptr.x = e.clientX - r.left; ptr.y = e.clientY - r.top;
    const dx = e.clientX - ptr.lx, dy = e.clientY - ptr.ly; ptr.lx = e.clientX; ptr.ly = e.clientY;
    ptr.moved += Math.abs(dx) + Math.abs(dy);
    if (ptr.mode === 'orbit') { CAM.azT -= dx * .009; CAM.elT = clamp(CAM.elT + dy * .006, -.05, 1.0); CAM.pause = 5; }
    else if (ptr.mode === 'pet') { const h = raycast(e); G.petting = h.type === 'dog'; }
    else if (ptr.mode === 'scrub') { const h = raycast(e); if (h.type === 'dog') scrub(Math.abs(dx) + Math.abs(dy), h.point); }
  });
  const up = e => {
    if (!ptr.down) return; ptr.down = false; G.petting = GM.autoPet > 0; canvasEl.classList.remove('petting');
    if (ptr.mode === 'orbit' && ptr.moved < 9 && performance.now() - ptr.t0 < 500) {
      const h = ptr.hit;
      if (h.type === 'click') h.fn();
      else if (h.type === 'ground') throwBall(h.point);
    }
    ptr.mode = null;
  };
  cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
  cv.addEventListener('wheel', e => { e.preventDefault(); CAM.zoom = clamp(CAM.zoom * (1 + e.deltaY * .001), .55, 1.6); }, { passive: false });
  $('#views').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return; Snd.init(); Snd.click();
    if (b.id === 'spin') { CAM.spin = !CAM.spin; b.setAttribute('aria-pressed', String(CAM.spin)); CAM.pause = 0; if (CAM.spin) { CAM.view = 'full'; CAM.azT = CAM.az; CAM.elT = VIEWS.full.el; $$('#views [data-v]').forEach(x => x.classList.toggle('on', x.dataset.v === 'full')); } return; }
    setView(b.dataset.v);
  });
  $('#dock').addEventListener('click', e => {
    const b = e.target.closest('.act'); if (!b || b.disabled) return; Snd.init(); Snd.click();
    const a = b.dataset.a;
    if (a === 'feed' || a === 'shop' || a === 'work' || a === 'house') {
      if (a === 'house' && G.loc !== 'home' && !G.sleeping) goLoc('home');
      openSheet(a);
    } else if (a === 'bath') toggleBath(); else if (a === 'pet') doPetButton(); else if (a === 'walk') toggleWalk(); else if (a === 'sleep') toggleSleep();
    renderHUD();
  });
  $('#sheetClose').addEventListener('click', () => { Snd.click(); closeSheet(); });
  $('#mute').addEventListener('click', () => { S.muted = !S.muted; $('#mute').setAttribute('aria-pressed', String(S.muted)); $('#mute').textContent = S.muted ? 'MUTE' : 'SND'; Snd.init(); touch(); });
  $('#dogName').addEventListener('change', e => { S.name = (e.target.value || '').trim().slice(0, 12) || DEFAULT_NAME; e.target.value = S.name; touch(); });
  document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });
  window.addEventListener('pagehide', save);
}

/* =========================================================
   BOOT + LOOP
   ========================================================= */
function localKey(d) { return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); }
function dailyAndAway() {
  const lines = [];
  const away = (Date.now() - S.lastSeen) / 60000;
  if (away > 2 && S.day > 1 || (away > 2 && S.stats.fed > 0)) {
    const gm = Math.min(away, 240) * 2 * .25;
    S.belly = Math.max(25, S.belly - gm * .07); S.clean = Math.max(30, S.clean - gm * .04); S.happy = Math.max(25, S.happy - gm * .05); S.energy = Math.max(30, S.energy - gm * .05);
    S.minutes = (S.minutes + gm * 1.5) % 1440;
    lines.push(nm() + ' missed you for ' + (away >= 60 ? Math.round(away / 60) + 'h' : Math.round(away) + 'm') + '.');
  }
  const today = localKey(new Date());
  if (S.lastDay !== today) {
    const y = new Date(); y.setDate(y.getDate() - 1);
    S.streak = S.lastDay === localKey(y) ? S.streak + 1 : 1;
    const bonus = 25 + Math.min(S.streak, 10) * 10;
    S.money += bonus; S.lastDay = today; touch();
    lines.push('Daily visit streak: ' + S.streak + '. Bonus +$' + bonus + '.');
  }
  return lines;
}
function boot() {

  const lines = dailyAndAway();
  $('#dogName').value = S.name; $('#mute').textContent = S.muted ? 'MUTE' : 'SND'; $('#mute').setAttribute('aria-pressed', String(S.muted));
  try { init3D(); } catch (err) { $('#fallback').style.display = 'flex'; $('#fallback').textContent = 'Your browser could not start 3D graphics (' + (err && err.message ? err.message : 'unknown') + ').'; return; }
  initBowl(); initInput();
  showLocation('home'); setView('full'); computeMood(); updateHint(); renderHUD();
  const intro = $('#intro');

  $('#introBonus').textContent = lines.join(' ');
  intro.hidden = false; G.paused = true;
  $('#introGo').addEventListener('click', () => { Snd.init(); Snd.bark(); intro.hidden = true; G.paused = false; dogFx('hop', 1); bubble('Hi!', 2); save(); });
  let last = performance.now(), t = 0;
  function frame(now) {

    if (!G.paused) tick(dt);
    if (GM.ptrSnd > 0) GM.ptrSnd -= dt;
    updateMove(dt, t); animateDog(dt, t); updateWorld(dt, t); updateCamera(dt); pfUpdate(dt); updateBubble(dt);

    GM.hudT -= dt; if (GM.hudT <= 0) { GM.hudT = .12; renderHUD(); }

  }

  window.__doodle = { S, G, CAM, AN, NAV, goLoc, doFeed, toggleBath, toggleSleep, toggleWalk, buy, equip, setView, tick, scrub, finishJob, startJob, openSheet };
}
boot();
